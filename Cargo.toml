[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
repository = "https://github.com/bitoolkit/bitgateway"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
auto-launch = "0.6"
base64 = "0.22"
bitgateway-client = { path = "crates/bitgateway-client", version = "0.2.1" }
bon = "3.9"
directories = "6"
hmac = "0.12"
iced = { version = "0.14", default-features = false, features = [
  "advanced-shaping",
  "tokio",
  "wayland",
  "wgpu",
  "x11"
] }
image = { version = "0.25", default-features = false, features = ["png"] }
md-5 = "0.10"
open = "5"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls"
] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
single-instance = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[workspace.lints.clippy]
all = "warn"
clone_on_ref_ptr = "warn"
default_trait_access = "warn"
enum_glob_use = "warn"
fn_params_excessive_bools = "warn"
format_collect = "warn"
format_push_string = "warn"
implicit_clone = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
missing_const_for_fn = "warn"
must_use_candidate = "warn"
needless_pass_by_value = "warn"
redundant_pub_crate = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
struct_excessive_bools = "warn"
undocumented_unsafe_blocks = "warn"
uninlined_format_args = "warn"
unnecessary_literal_bound = "warn"
use_self = "warn"
verbose_file_reads = "warn"
wildcard_imports = "warn"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"
codegen-units = 1
